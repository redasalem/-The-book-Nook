<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>اشترك الآن</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@100;200;300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/style.css" />
    <link style rel="stylesheet" href="../style/subNow.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light mb-4">
      <div class="container">
        <a class="navbar-brand fw-bold" href="../index.html">دار الفكر</a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="../index.html">الرئيسية</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">عن المكتبة</a>
            </li>
            <li class="nav-item"><a class="nav-link" href="#">الخدمات</a></li>
            <li class="nav-item">
              <a class="nav-link" href="classrooms.html">الصفوف الدراسية</a>
            </li>
          </ul>
          <a href="/The Book Nook/account/account.html" class="btn btn-primary text-white">الحساب</a>
        </div>
      </div>
    </nav>

    <div class="container form-container con-sub">
      <h3 class="text-center mb-4">اختر الباقة</h3>
      <div class="row text-center">
        <div class="col-md-4 mb-3 cardSub">
          <label class="plan-card d-block">
            <input
              type="radio"
              name="plan"
              class="form-check-input"
              value="basic"
              checked
            />
            <h5 class="mt-2">باقة أساسية</h5>
            <p>125 جنيه / شهر</p>
            <p class="text-primary">✔ ميزات محدودة</p>
          </label>
        </div>
        <div class="col-md-4 mb-3 cardSub">
          <label class="plan-card d-block">
            <input
              type="radio"
              name="plan"
              class="form-check-input"
              value="pro"
            />
            <h5 class="mt-2">باقة احترافية</h5>
            <p>250 جنيه / شهر</p>
            <p class="text-primary">✔ كل الميزات</p>
          </label>
        </div>
        <div class="col-md-4 mb-3 cardSub">
          <label class="plan-card d-block">
            <input
              type="radio"
              name="plan"
              class="form-check-input"
              value="premium"
            />
            <h5 class="mt-2">باقة مميزة</h5>
            <p>350 جنيه / شهر</p>
            <p class="text-primary">✔ كل شيء + شهر مجاني</p>
          </label>
        </div>
      </div>

      <div class="mb-3">
        <select id="payment" class="form-select p-3 mb-4 mt-4">
          <option disabled value="">اختر طريقة الدفع</option>
          <option value="credit">بطاقة ائتمان</option>
          <option value="fawry">فوري</option>
          <option value="vodafone">فودافون كاش</option>
        </select>
      </div>

      <div class="text-center">
        <button class="btn btn-primary w-50 p-3 mb-5 mt-4">اشترك الآن</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
