<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الملف الشخصي</title>

  <!-- Bootstrap RTL CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <!-- خط pixel يشبه ماين كرافت -->
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style/profilePage.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">دار الفكر</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link active" href="../index.html">الرئيسية</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../index.html">عن المكتبة</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../index.html">الخدمات</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../classrooms/classrooms.html">الصفوف الدراسية</a>
          </li>
        </ul>
        <div id="user-info-navbar"></div>
      </div>
    </div>
  </nav>

  <div class="container mt-4">
    <h2>الملف الشخصي</h2>

    <div class="info-section">
      <h3>معلومات الحساب</h3>
      <label for="username">الاسم الكامل:</label>
      <input type="text" id="username" class="form-control mb-3" disabled>

      <label for="email">البريد الإلكتروني:</label>
      <input type="email" id="email" class="form-control mb-3" disabled>

      <label for="password">كلمة المرور:</label>
      <input type="password" id="password" class="form-control mb-3" disabled>

      <div class="edit-actions">
        <button id="editBtn" type="button" class="btn btn-primary" onclick="enableEdit()">تعديل</button>
        <button id="saveBtn" type="button" class="btn btn-success" onclick="saveProfile()" style="display:none;">حفظ</button>
      </div>
      <div id="edit-msg" class="alert mt-3" style="display: none;"></div>
    </div>

    <div class="welcome-section" id="welcomeMsg"></div>

    <div class="section">
      <h3>الخصائص المتاحة</h3>
      <div class="features-grid">
        <div class="feature-card" onclick="manageSubscriptions()">
          <span class="feature-icon">📦</span>
          إدارة الاشتراكات
        </div>
        <div class="feature-card" onclick="viewCart()">
          <span class="feature-icon">🛒</span>
          سلة المشتريات
        </div>
        <div class="feature-card" onclick="showFavorites()">
          <span class="feature-icon">❤️</span>
          المفضلة
        </div>
        <div class="feature-card" onclick="showHistory()">
          <span class="feature-icon">🕒</span>
          تاريخ الطلبات
        </div>
        <div class="feature-card" onclick="showNotifications()">
          <span class="feature-icon">🔔</span>
          الإشعارات
        </div>
        <div class="feature-card" onclick="toggleDarkMode()">
          <span class="feature-icon">🌙</span>
          الوضع الليلي
        </div>
        <div class="feature-card" onclick="support()">
          <span class="feature-icon">💬</span>
          الدعم والمساعدة
        </div>
        <div class="feature-card" onclick="deactivateAccount()">
          <span class="feature-icon">⚠️</span>
          تعطيل الحساب مؤقتاً
        </div>
      </div>
    </div>

    <div class="logout">
      <button onclick="logout()" class="btn btn-danger">تسجيل الخروج</button>
    </div>
  </div>

  <!-- Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../script/profilePage.js"></script>
  <script src="../script/navbarUser.js"></script>
</body>
</html>
